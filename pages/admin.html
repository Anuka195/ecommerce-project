<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/header-global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <header>
    <div class="root-header">
      E-commerce
      <input type="checkbox" id="menu-toggle">

      <label for="menu-toggle" class="hamburger-menu">
          <span></span>
          <span></span>
          <span></span>
      </label>
      <nav>
        <ul class="nav-links-list">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../pages/catalog.html">Catalog</a></li>
          <li><a href="../pages/favorites.html">Favorites</a></li>
          <li><a href="../pages/cart.html">Cart</a></li>
          <li><a href="../pages/admin.html">Admin</a></li>
        </ul>
      </nav>
    </div>
    <div class="sub-header">Admin</div>
  </header>
    <main id="adminPageMain">

      <aside class="adminFilters">
        <form id="searchForm">
          <input
            type="search"
            id="searchInput"
            placeholder="Search products"/>
          <button type="submit">
            Search
          </button>
        </form>

        <select name="filterDropDown" id="filterDropDown">
          <option>
            All
          </option>
        </select>

        <select id="sortDropDown">
          <option value="">Sort by...</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="title-asc">Title: A–Z</option>
          <option value="title-desc">Title: Z–A</option>
        </select>

        <button type="button" id="addProductBtn">Add product</button>
      </aside>
      

      <div id="adminPageLoading"></div>
      <div id="adminPageMessages"></div>
      <div id="adminPageContent" class="adminList"></div>
    </main>

    <div id="addProduct" class="hidden">
      <form id="addProductForm">
        <h2>New product</h2>

        <label>
          Title
          <input type="text" id="newTitle" required/>
        </label>

        <label>
          Price
          <input type="number" id="newPrice" min="0" step="0.01" required/>
        </label>

        <label>
          Image URL
          <input type="url" id="newImage" required/>
        </label>

        <label>
          Category
          <select id="newCategory" required></select>
        </label>

        <button type="submit">Add</button>
        <button type="button" id="cancelAddBtn">Cancel</button>
      </form>
    </div>

    <script src="../js/admin.js" type="module"></script>
  </body>
</html>
